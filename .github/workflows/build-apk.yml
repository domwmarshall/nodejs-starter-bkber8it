name: Build Dryer Lab APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable app signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: candy-dryer-lab-signing-v1

      - name: Create signing key on first build
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v               -keystore ~/.android/debug.keystore               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Candy Dryer Lab,OU=Personal,O=Dryer Lab,L=Norfolk,C=GB"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Candy-Dryer-Lab-MK5
          path: app/build/outputs/apk/debug/app-debug.apk
