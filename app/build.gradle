plugins { id 'com.android.application' }

android {
    namespace 'uk.dom.candydryerlab'
    compileSdk 35

    defaultConfig {
        applicationId 'uk.dom.candydryerlab'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '0.12.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
